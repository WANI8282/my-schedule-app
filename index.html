<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eafa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schedule">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/app-icon.svg">
  <title>スケジュール帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="skeleton" id="skeleton" aria-hidden="true"><div class="skeleton-head"></div><div class="skeleton-grid"></div></div>
  <div class="app-container glass-app" id="app" aria-label="スケジュール帳">
    <div class="drawer-scrim" id="drawer-scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="操作パネル">
      <div class="brand"><span>Schedule</span></div>
      <div class="control-panel"><button class="action-btn active" id="btn-week">週間</button><button class="action-btn" id="btn-month">月間</button></div>
      <section class="preset-palette">
        <div class="palette-header"><h3>クイック追加</h3><button class="icon-btn" id="btn-open-preset-setting" aria-label="クイック追加を設定">設定</button></div>
        <p class="helper">種類を選び、1コマをタップ。ドラッグで連続追加</p>
        <div class="palette-grid" id="palette-grid"></div>
        <button class="btn-cancel-mode" id="btn-cancel-edit">選択を解除</button>
      </section>
      <section class="wage-card" id="wage-card" aria-live="polite">
        <div class="wage-card-heading"><span>今月のバイト予想</span><span class="wage-rate-control"><span class="wage-rate" id="wage-rate">時給 ¥1,100</span><button class="wage-edit-toggle" id="wage-edit-toggle" type="button" aria-expanded="false" aria-controls="wage-editor">時給変更</button></span></div>
        <strong class="wage-total" id="wage-total">¥0</strong>
        <span class="wage-hours" id="wage-hours">0時間分の予定</span>
        <div class="wage-editor" id="wage-editor" hidden><label for="wage-input">時給</label><div class="wage-input-wrap"><span>¥</span><input id="wage-input" type="number" min="1" max="1000000" step="1" inputmode="numeric" aria-label="時給を円で入力"><span>/時間</span></div></div>
      </section>
      <button class="settings-btn" id="find-free-btn" aria-pressed="false">空き時間を探す</button>
      <button class="settings-btn" id="copy-week-btn">先週をコピー</button>
      <button class="settings-btn" id="btn-open-timetable">裏時間割の設定</button>
      <p class="privacy-note">予定はこの端末内に保存されます</p>
    </aside>
    <main class="main-content">
      <header class="calendar-header">
        <button class="menu-btn" id="menu-btn" aria-label="メニューを開く">≡</button>
        <button class="nav-arrow" id="prev-btn" aria-label="前へ">‹</button>
        <h1 id="calendar-title"></h1>
        <button class="nav-arrow" id="next-btn" aria-label="次へ">›</button>
        <button class="today-btn" id="today-btn">今日</button>
        <button class="theme-btn" id="theme-toggle" aria-label="ダークモードに切り替え">ナイト</button>
      </header>
      <section class="next-event-card" id="next-event-card" aria-live="polite">
        <span class="next-event-label">次の予定</span>
        <span class="next-event-detail" id="next-event-detail">予定を確認しています</span>
      </section>
      <div class="view-wrapper" id="view-week"><div class="grid-header" id="week-header"></div><div class="all-day-row" id="all-day-row"></div><div class="timeline-container"><div class="timeline-grid" id="timeline-grid"></div></div></div>
      <div class="view-wrapper hidden" id="view-month"><div class="month-grid" id="month-grid"></div></div>
    </main>
    <button class="ai-fab" id="ai-fab">AIにおまかせ</button>
    <div class="modal-overlay" id="preset-modal"><section class="modal-content bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="preset-title"><div class="sheet-grabber"></div><h2 id="preset-title">クイック追加を編集</h2><div class="preset-list" id="preset-list"></div><button class="btn-add-preset" id="btn-add-preset">＋ ボタンを追加</button><div class="modal-actions"><button class="btn-modal-cancel" id="btn-preset-cancel">閉じる</button><button class="btn-modal-save" id="btn-preset-save">保存</button></div></section></div>
    <div class="modal-overlay" id="timetable-modal"><section class="modal-content modal-large bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="timetable-title"><div class="sheet-grabber"></div><h2 id="timetable-title">裏時間割</h2><fieldset class="period-length-setting"><legend>コマの長さ</legend><div class="period-length-switch" role="group" aria-label="コマの長さを選択"><button type="button" class="period-length-btn" data-minutes="60" aria-pressed="true"><span>60分コマ</span><small>1時間周期</small></button><button type="button" class="period-length-btn" data-minutes="90" aria-pressed="false"><span>90分コマ</span></button></div></fieldset><label class="toggle-semester"><input type="checkbox" id="toggle-semester-active" checked><span>授業期間中として表示する</span></label><div class="timetable-editor" id="timetable-editor"></div><div class="modal-actions"><button class="btn-modal-cancel" id="btn-timetable-cancel">閉じる</button><button class="btn-modal-save" id="btn-timetable-save">保存</button></div></section></div>
    <div class="modal-overlay" id="ai-modal"><section class="modal-content bottom-sheet ai-sheet" role="dialog" aria-modal="true" aria-labelledby="ai-title"><div class="sheet-grabber"></div><h2 id="ai-title">AIアシスタント</h2><p>日時と予定の種類を読み取り、カレンダーに追加します。</p><textarea id="ai-prompt" rows="3" placeholder="例：明日 13時から17時 バイト"></textarea><div class="modal-actions"><button class="btn-modal-cancel" id="ai-close">閉じる</button><button class="btn-modal-save" id="ai-submit">予定を追加</button></div></section></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
